# Workspace root — mirrors the Kana layout: one domain library crate plus the
# binary that assembles and runs it.
#
#   apps/scraper-service  lib  — domain / application / infrastructure / presentation
#   apps/gateway          bin  — starts the server (`scraper`)
#
# Profiles live here because Cargo only reads them from the workspace root.
[workspace]
resolver = "3"
members = ["apps/scraper-service", "apps/gateway"]
# Standalone helper crate (its own edition, no shared deps) — not part of the build.
exclude = ["tools/auto-lint"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Asep Haryana"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_variables = "deny"
unused_imports = "deny"
unused_must_use = "deny"
dead_code = "deny"
unused_mut = "deny"
unreachable_code = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
explicit_outlives_requirements = "deny"
unused_labels = "deny"
unused_braces = "deny"
noop_method_call = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unnecessary_to_owned = "deny"

# Profile optimasi untuk production - fokus pada performa runtime maksimal
[profile.release]
opt-level = 3           # Optimasi level maksimal
lto = "fat"             # Full LTO untuk inlining maksimal dan binary optimal
codegen-units = 1       # Single codegen unit untuk optimasi maksimal (lebih lambat build, binary lebih cepat)
incremental = false     # Disable incremental untuk optimasi penuh
debug = false           # No debug info untuk binary lebih kecil
strip = true            # Strip symbols untuk binary lebih kecil
panic = "abort"         # Abort on panic (binary lebih kecil dan lebih cepat)
overflow-checks = false # Non-overflowing arithmetic for speed (disable in debug)

# Optimize dependencies too
[profile.dev]
opt-level = 0

[profile.bench]
opt-level = 3
lto = "fat"
