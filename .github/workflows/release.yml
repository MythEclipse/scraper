name: Release

# Tag-driven release: the version is decided on the developer's machine by the
# pre-push hook (lefthook + scripts/bump-version.mjs), committed into every
# manifest, and published by pushing a `vX.Y.Z` tag. CI never invents a version.
#
# This replaces semantic-release, which decided the version in CI and then had to
# push both a bump commit and a tag — two refs, two pushes, each depending on the
# other. When the tag was attempted before the commit was visible the server
# rejected it with `missing necessary objects` and the release was lost. That
# happened on three consecutive releases here. Moving the decision before the
# push removes the race instead of retrying around it.
#
# The trade is one manual step: after pushing your commits, create the tag:
#
#     git tag v1.4.0 && git push origin v1.4.0
#
# The tag is pushed by a human with real credentials, so it triggers this
# workflow. (A tag pushed with GITHUB_TOKEN would not: GitHub suppresses runs for
# events that token creates. That suppression is exactly why the old design had
# to do everything inside one workflow run.)
#
# The three jobs are separate because a job-level `strategy.matrix` cannot read
# `steps.*`: the matrix is evaluated before any step runs. A matrix built from
# `steps.prepare.outputs` makes GitHub reject the whole workflow at parse time,
# and the symptom is a run with zero jobs and no log to explain it. So the image
# list is resolved by a job (whose output the next job's matrix CAN read).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to republish"
        required: true
        type: string

permissions:
  contents: read
  # Without packages: write the GHCR push fails with 403. Declared at workflow
  # level so a future job cannot silently lose it; the token is still scoped to
  # THIS repository's packages only.
  packages: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release at a time, repo-wide, and never cancel one half-published. A
    # per-ref group would let two pushes both read the same "latest tag" and
    # race to create the same version.
    #
    # Scoped to this job on purpose: applying it workflow-wide would make a
    # ten-minute image build block the next push's release run, and those two do
    # not contend for anything.
    # One release at a time, repo-wide, and never cancel one half-published.
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 1

      # The tag is the source of truth, and it must agree with the manifests.
      # A mismatch means someone tagged without running the bump, so the image
      # would be published under a version the binary does not report about
      # itself (`/health` reads CARGO_PKG_VERSION). Reject it here rather than
      # ship that.
      - name: Validate tag against the manifests
        id: check
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -Eeuo pipefail
          # Docker-safe semver: `1` and `latest` are both legal image tags that
          # would quietly overwrite the wrong thing, so the shape is enforced.
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a Docker-safe semver tag like v1.4.0"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          # Build metadata is rejected by the regex above, but a `+` in the
          # version would also be an illegal image tag.
          if [[ "$version" == *"+"* ]]; then
            echo "::error::build metadata is not allowed in a release tag"
            exit 1
          fi

          cargo_version=$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          package_version=$(node -p "require('./package.json').version")

          if [[ "$cargo_version" != "$version" || "$package_version" != "$version" ]]; then
            echo "::error::tag $RELEASE_TAG does not match the manifests"
            echo "::error::  Cargo.toml   = $cargo_version"
            echo "::error::  package.json = $package_version"
            echo "::error::Run \`node scripts/bump-version.mjs\`, commit, and re-tag."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (tag $RELEASE_TAG)"

  prepare:
    name: Resolve images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          version="$VERSION"
          # The tag is validated in `validate`, but this value becomes an image
          # value becomes an image tag, and `1` and `latest` are both legal tags
          # that would quietly overwrite the wrong thing.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$version' is not a Docker-safe semver version"
            exit 1
          fi

          # Normalise build_args HERE, in prepare, not in the publish job.
          #
          # docker/build-push-action parses `build-args` as newline-separated
          # KEY=VALUE. A JSON object is accepted and handed through literally,
          # so every ARG resolves EMPTY and the build still succeeds.
          #
          # It has to happen here rather than in a step of the publish job:
          # `toJSON()` pretty-prints, and GitHub renders a multi-line env value
          # verbatim into the step's env block, so the value never arrives as the
          # single token a step could split. Passing it through the matrix keeps
          # it intact — newlines included, which is the format wanted here.
          images=$(jq -c '
            .images
            | map(select(.enabled != false))
            | map(
                # Both of these are flattened here for the same reason: the
                # matrix carries them intact, and the consumer parses KEY=VALUE.
                # Doing it in a step of the publish job cannot work — toJSON()
                # pretty-prints and GitHub renders a multi-line env value
                # verbatim, so the step never sees a single token.
                (if (.build_args | type) == "object" then
                   .build_args = ([.build_args | to_entries[] | "\(.key)=\(.value)"] | join("\n"))
                 else . end)
                | (if (.labels | type) == "object" then
                     .labels = ([.labels | to_entries[] | "\(.key)=\(.value)"] | join("\n"))
                   else . end)
              )
          ' .github/docker-images.json)
          if [[ "$(jq 'length' <<<"$images")" -eq 0 ]]; then
            echo "::error::.github/docker-images.json enables no images"
            exit 1
          fi

          # Every entry needs its Dockerfile and .dockerignore present AND
          # git-tracked. buildx builds from this checkout, so an untracked
          # Dockerfile fails later as a bare "unable to prepare context" naming
          # neither the image nor the cause. A missing .dockerignore does not
          # fail at all: it ships node_modules and .git inside the image.
          while IFS= read -r img; do
            package=$(jq -r '.package' <<<"$img")
            context=$(jq -r '.context' <<<"$img")
            file=$(jq -r '.file' <<<"$img")
            # The package name becomes a repository name in the registry path,
            # where only lowercase alphanumerics and separators are legal.
            [[ "$package" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] \
              || { echo "::error::$package is not a valid GHCR package name (lowercase [a-z0-9._-])"; exit 1; }
            # $context/.dockerignore, NOT the repo root's: buildx reads the
            # ignore file from the CONTEXT. A repo whose contexts are service
            # subdirectories (each its own package with its own lockfile) has no
            # root .dockerignore to find, and the root copy would be ignored.
            for path in "$context/$file" "$context/.dockerignore"; do
              [[ -f "$path" ]] || { echo "::error::$package: missing $path"; exit 1; }
              git ls-files --error-unmatch "$path" >/dev/null \
                || { echo "::error::$package: $path is not tracked by git — CI cannot see it"; exit 1; }
            done
          done < <(jq -c '.[]' <<<"$images")

          echo "images=${images}" >>"$GITHUB_OUTPUT"
          {
            echo "### Publishing ${version}"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            # A bash loop rather than a jq interpolation program: the jq form
            # needs backticks and \(...) inside a single-quoted program nested
            # in a YAML run: block, which is hard to review and untestable
            # offline. The package name is already validated as [a-z0-9._-].
            while IFS= read -r package; do
              echo "| \`ghcr.io/${GHCR_OWNER,,}/${package}\` | \`ghcr.io/${GHCR_OWNER,,}/${package}:${version}\` |"
            done < <(jq -r '.[].package' <<<"$images")
          } >>"$GITHUB_STEP_SUMMARY"

  docker:
    name: Publish ${{ matrix.image.package }}
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level matrix, reading the PREVIOUS JOB's output — which is legal in
    # this context, unlike a step output from the same job.
    strategy:
      # One broken image must not cancel its siblings: a monorepo where web
      # fails should still publish api, rather than leaving the release with no
      # images at all.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      # Build inputs that are fetched rather than committed. A repo whose
      # Dockerfile COPYs a gitignored dataset needs it in the checkout first, and
      # its absence surfaces only as buildx's "failed to calculate checksum of
      # ref" — which names the missing path but not the reason it is missing.
      #
      # Repo-supplied: a shell command from .github/docker-images.json, so this
      # workflow needs no per-repo knowledge and no new template per repo.
      - name: Fetch build inputs
        if: ${{ matrix.image.prebuild }}
        env:
          PREBUILD: ${{ matrix.image.prebuild }}
        run: |
          set -Eeuo pipefail
          echo "$PREBUILD" | bash -euxo pipefail

      - uses: docker/setup-buildx-action@v4

      # The default GITHUB_TOKEN is scoped to this repo's packages and is all a
      # publish needs. A PAT would work and would be a credential with a much
      # wider blast radius than this job requires.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.file }}
          push: true
          platforms: ${{ matrix.image.platforms || 'linux/amd64' }}
          tags: |
            ghcr.io/mytheclipse/${{ matrix.image.package }}:${{ needs.validate.outputs.version }}
          # Newline-separated KEY=VALUE, which is what this action parses.
          # Passing a JSON object is accepted and handed through literally, so
          # every ARG in the Dockerfile resolves empty and the build still
          # succeeds — a green run that configured nothing.
          build-args: ${{ matrix.image.build_args || '' }}
          # Repo-supplied labels are appended, so an image can record facts the
          # standard cannot know — which dataset revision it was built against,
          # for instance. They were being dropped: docker-images.json accepted a
          # `labels` key that this fixed list silently ignored, so a pinned input
          # was documented in config and absent from the artifact.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.title=${{ matrix.image.package }}
            ${{ matrix.image.labels || '' }}
          cache-from: type=gha,scope=${{ matrix.image.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.package }}

      # The action reporting success proves layers were uploaded, not that the
      # registry accepted a manifest under the tag we asked for. Read the tag
      # back; the digest comparison also catches a concurrent publish silently
      # overwriting this tag.
      - name: Verify the published tag resolves
        env:
          IMAGE: ghcr.io/mytheclipse/${{ matrix.image.package }}:${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DIGEST" ]] || { echo "::error::buildx reported no digest"; exit 1; }
          if ! published=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "::error::$IMAGE is not visible in the registry after push"
            exit 1
          fi
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error::$IMAGE resolves to $published, expected $DIGEST — a concurrent push overwrote it"
            exit 1
          fi
          echo "$IMAGE -> $published"

      # Here rather than in its own job: each matrix leg promotes only its own
      # image, so one image failing cannot leave another unpromoted, and a
      # prerelease can never move latest — the suffix is part of the version.
      - name: Promote latest
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          if [[ '${{ matrix.image.latest }}' == 'false' ]]; then
            echo "${{ matrix.image.package }} opts out of the latest tag"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "ghcr.io/${GHCR_OWNER,,}/${{ matrix.image.package }}:latest" \
            "ghcr.io/${GHCR_OWNER,,}/${{ matrix.image.package }}:${VERSION}"
          echo "ghcr.io/${GHCR_OWNER,,}/${{ matrix.image.package }}:latest -> ${VERSION}"
