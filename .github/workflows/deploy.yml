name: Deploy Scraper

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scraper-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      # The lib/bins carry ~80 pre-existing clippy warnings (mostly
      # unwrap/expect, which this crate's own lints only warn on). Turning them
      # into errors here would block every deploy on work unrelated to the
      # pipeline, so they are reported and not gated. `panic`, `todo`,
      # `unimplemented` and the dead_code/unused deny-list from Cargo.toml
      # [lints] ARE real errors already and still fail this step.
      - name: Clippy
        run: cargo clippy --lib --bins --all-features

      # Assert the suite actually ran: `cargo test` exits 0 when a target has
      # zero tests, so a green run proves nothing without the count assertion.
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee /tmp/test.log
          grep -qE '^test result: ok\. [1-9][0-9]* passed' /tmp/test.log \
            || { echo "FAIL: expected at least one passing test"; exit 1; }

      # The binary is COMPILED HERE, not on the VPS.
      #
      # The crate links dynamically against libssl.so.3 and libc.so.6. The
      # production host is Ubuntu 26.04 (glibc 2.43); ubuntu-latest is 24.04
      # (glibc 2.39) today. That direction is safe — glibc is backward
      # compatible, so a binary built against 2.39 runs on 2.43 — which the old
      # comment had backwards when it dismissed a runner artifact as "only a
      # guess".
      #
      # Building here also stops the release dir from carrying a target/ tree:
      # it was 1014M of the 1016M release, for a 25M binary.
      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test the artifact
        run: |
          set -euo pipefail
          BIN=target/release/scraper
          test -x "$BIN"
          # Prove the binary this runner produced actually executes on the
          # production OS. If glibc ever goes the other way, this fails here
          # rather than as a failed execve on the VPS after the symlink flip.
          ldd "$BIN"
          "$BIN" --version || true
          mkdir -p payload
          cp "$BIN" payload/scraper
          # Read at runtime by the Playwright fallback, so it must travel too.
          cp scrape_media.py payload/scrape_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: scraper-release
          path: payload/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Checkout is required: the deploy script is scp'd from THIS checkout,
      # never from the payload that is live on the VPS.
      - uses: actions/checkout@v7

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deploy script to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -o BatchMode=yes scripts/deploy-direct.sh "$VPS_USER@$VPS_HOST:/tmp/scraper-deploy-direct.sh"

      - name: Download the CI-built binary
        uses: actions/download-artifact@v4
        with:
          name: scraper-release
          path: payload

      # Ship the payload to a staging dir on the VPS. The deploy script unpacks
      # from here and never compiles, so no toolchain is needed on the host.
      - name: Upload payload to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/scraper-payload && mkdir -p /tmp/scraper-payload'
          scp -o BatchMode=yes -r payload/. "$VPS_USER@$VPS_HOST:/tmp/scraper-payload/"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'chmod 0755 /tmp/scraper-payload/scraper && ls -l /tmp/scraper-payload'

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "ARTIFACT_DIR=/tmp/scraper-payload bash /tmp/scraper-deploy-direct.sh '$DEPLOY_SHA' '$DEPLOY_REF'"

      - name: Verify service state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "systemctl is-active scraper && systemctl show -p MainPID -p NRestarts -p ActiveEnterTimestamp -p ExecMainStartTimestamp --value scraper && readlink -f /opt/scraper/current && curl -fsS --max-time 10 http://127.0.0.1:4091/health"

      - name: Remove deploy script
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "rm -f /tmp/scraper-deploy-direct.sh"